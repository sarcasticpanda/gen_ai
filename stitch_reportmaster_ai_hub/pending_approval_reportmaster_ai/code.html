<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Account Pending - ReportMaster AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#13131b",
                        "primary-container": "#8083ff",
                        "outline-variant": "#464554",
                        "surface-tint": "#c0c1ff",
                        "tertiary-fixed": "#ffdcc5",
                        "error-container": "#93000a",
                        "tertiary": "#ffb783",
                        "surface-container-lowest": "#0d0d15",
                        "on-tertiary-container": "#452000",
                        "secondary-container": "#2f3aa3",
                        "primary-fixed": "#e1e0ff",
                        "on-tertiary-fixed": "#301400",
                        "surface-bright": "#393841",
                        "on-tertiary": "#4f2500",
                        "on-secondary-fixed-variant": "#2f3aa3",
                        "on-surface": "#e4e1ed",
                        "on-primary-fixed": "#07006c",
                        "error": "#ffb4ab",
                        "primary": "#c0c1ff",
                        "surface-container": "#1f1f27",
                        "background": "#13131b",
                        "on-surface-variant": "#c7c4d7",
                        "surface-dim": "#13131b",
                        "on-secondary-container": "#a8afff",
                        "surface-container-highest": "#34343d",
                        "surface-container-low": "#1b1b23",
                        "inverse-on-surface": "#303038",
                        "secondary-fixed": "#e0e0ff",
                        "surface-variant": "#34343d",
                        "on-error-container": "#ffdad6",
                        "primary-fixed-dim": "#c0c1ff",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "on-secondary-fixed": "#000767",
                        "on-background": "#e4e1ed",
                        "tertiary-container": "#d97721",
                        "surface-container-high": "#292932",
                        "on-secondary": "#131e8c",
                        "secondary-fixed-dim": "#bdc2ff",
                        "on-primary": "#1000a9",
                        "outline": "#908fa0",
                        "inverse-primary": "#494bd6",
                        "secondary": "#bdc2ff",
                        "on-tertiary-fixed-variant": "#703700",
                        "inverse-surface": "#e4e1ed",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-primary-container": "#0d0096",
                        "on-error": "#690005"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "layout_margin": "24px",
                        "lg": "24px",
                        "md": "16px",
                        "layout_gutter": "16px",
                        "xl": "32px",
                        "sm": "12px",
                        "xxs": "4px",
                        "xs": "8px"
                    },
                    "fontFamily": {
                        "body": ["Inter"],
                        "display": ["Inter"],
                        "label-caps": ["Inter"],
                        "heading": ["Inter"],
                        "data-tabular": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body": ["15px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "heading": ["22px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "data-tabular": ["14px", { "lineHeight": "1.4", "letterSpacing": "-0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex items-center justify-center p-layout_margin antialiased">
<!-- 
      Navigation Shell Suppressed:
      Reason: The user is in a linear/transactional state ("Pending Approval"). 
      This is a dead-end relative to the global nav ecosystem until approved.
    -->
<main class="w-full max-w-md">
<!-- Surface-2 Card -->
<div class="bg-surface border border-outline-variant rounded-xl p-xl flex flex-col items-center text-center relative overflow-hidden">
<!-- Subtle Top Glow indicator for active status context -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-primary/40"></div>
<!-- RM Logo Monogram -->
<div class="w-12 h-12 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container font-heading text-heading mb-lg border border-primary/20">
                RM
            </div>
<!-- Visual Indicator -->
<div class="mb-layout_gutter p-md rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 0;">
                    hourglass_empty
                </span>
</div>
<!-- Content Area -->
<h1 class="font-heading text-heading text-on-surface mb-xs">
                Account pending approval
            </h1>
<p class="font-body text-body text-on-surface-variant mb-layout_margin max-w-[300px]">
                Your request has been submitted and is currently under review. You'll receive an email once approved.
            </p>
<!-- Status Pill Badge -->
<div class="inline-flex items-center gap-xs px-sm py-[6px] rounded bg-primary/10 border border-primary/30 text-primary font-label-caps text-label-caps mb-xl">
<span class="material-symbols-outlined text-[14px]">mail</span>
<span>user@institution.com</span>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-md">
<button class="w-full py-sm px-md bg-surface-container-high border border-outline-variant rounded text-on-surface font-label-caps text-label-caps hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px]">refresh</span>
                    Check email for updates
                </button>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors py-xs" href="#">
                    Sign out
                </a>
</div>
</div>
</main>
</body></html>
